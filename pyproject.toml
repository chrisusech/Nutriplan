[project]
name = "nutriplan"
version = "0.1.0"
description = "Generador de planes nutricionales — backend hexagonal (Nivel 1: local, FastAPI + SQLite)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "alembic>=1.13",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "weasyprint>=62",
    "python-docx>=1.1",
    "mammoth>=1.7",
    "numpy>=1.26",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.50.0",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "syrupy>=4.6",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml",
    "httpx>=0.28.1",
]

[project.scripts]
nutriplan = "nutriplan.ui.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nutriplan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nutriplan"]
mypy_path = "src"

# Ninguna de las dos publica py.typed; se usan tras un borde tipado
# (Renderer, read_docx_text), así que el Any no se filtra al dominio.
[[tool.mypy.overrides]]
module = ["weasyprint.*", "mammoth.*"]
ignore_missing_imports = true
