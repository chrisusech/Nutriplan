[project]
name = "nutriplan"
version = "0.1.0"
description = "Generador de planes nutricionales — backend hexagonal (Nivel 1: local, FastAPI + SQLite)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "greenlet>=3.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "mammoth>=1.7",
    "numpy>=1.26",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.50.0",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
# Solo para verificar los ID token de Apple: firma RS256 contra su JWKS. Google
# no lo necesita (usa su endpoint `tokeninfo`), así que no es una dependencia base.
apple = ["pyjwt[crypto]>=2.9"]
# El motor usa modelos de pesos abiertos vía API compatible con OpenAI; Claude
# es opcional y se carga solo si hay ANTHROPIC_API_KEY.
anthropic = ["anthropic>=0.40"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "syrupy>=4.6",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml",
    "httpx>=0.28.1",
    # Solo para generar los .docx de fixture del intake; la app ya no exporta Word.
    "python-docx>=1.1",
    "playwright>=1.62.0",
]

[project.scripts]
nutriplan = "nutriplan.ui.web.app:main"
nutriplan-food = "nutriplan.adapters.food.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nutriplan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=nutriplan --cov-branch --cov-report=term-missing"

[tool.coverage.run]
source = ["src/nutriplan"]
omit = ["*/adapters/food/cli.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",  # cuerpos de Protocol
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations"]
# Criterio de CI: `ruff check` (lint). NO exigimos `ruff format --check`: el
# repo usa llamadas compactas a propósito y formatearlas reescribía ~80
# archivos. Quien quiera formatear un archivo nuevo puede; no es gate.

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nutriplan"]
mypy_path = "src"

# mammoth no publica py.typed; se usa tras un borde tipado (read_docx_text),
# así que el Any no se filtra al dominio.
[[tool.mypy.overrides]]
module = ["mammoth.*", "jwt.*"]
ignore_missing_imports = true
