# Platos: las combinaciones que un nutricionista firmaría.
#
# Un plato declara sus componentes por ROL. Cada uno apunta a una CLASE
# (`@lacteo_magro`) o a un alimento concreto (`#aguacate`). `optional: true` = si
# el cliente no tiene nada que lo cubra, el plato se sirve sin él en vez de
# descartarse.
#
# Máximo 4 componentes: `build_selection_schema` no admite más alimentos por comida.
#
# `version` entra en compute_input_hash: si añades un plato, los planes se
# regeneran en vez de servirse de la caché.
# 2026.07.15: los carbos ganan peso por comida (`FoodItem.slot_weights`). El hash
# de entrada mira la versión del catálogo, no los datos del alimento: sin subirla,
# los planes ya generados se servirían de caché y parecería que el motor sigue
# poniendo arepa en los almuerzos.
version: "2026.08.01"

templates:
  # ---------------------------------------------------------------- DESAYUNO --

  - id: huevos_carbo_grasa
    name: Huevos con carbohidrato y grasa
    recipe:
      - "Calienta una sartén antiadherente a fuego medio con unas gotas de aceite."
      - "Cocina los huevos como más te gusten: revueltos, en tortilla o al ojo. Salpimenta al final."
      - "Tuesta o calienta el carbohidrato mientras tanto."
      - "Sirve, corta la grasa en láminas encima y come caliente."
    slots: [desayuno]
    components:
      - {role: protein, sel: "@huevos"}
      - {role: carb, sel: "@carbo_desayuno"}
      - {role: fat, sel: "@grasa_desayuno", optional: true}

  - id: bowl_lacteo_avena_fruta
    name: Bowl de lácteo con avena y fruta
    recipe:
      - "Sirve el lácteo en un tazón hondo."
      - "Agrega la avena y mezcla hasta que se hidrate."
      - "Corta la fruta encima. Si tienes tiempo, déjalo cinco minutos: la avena queda más suave."
    slots: [desayuno]
    components:
      - {role: protein, sel: "@lacteo_magro"}
      - {role: carb, sel: "@avena"}
      - {role: fruit, sel: "@fruta_bowl"}

  - id: lacteo_carbo_crema
    name: Lácteo con tostada y crema de frutos secos
    recipe:
      - "Tuesta el carbohidrato hasta que esté crujiente."
      - "Úntale la crema de frutos secos mientras está caliente, para que se extienda sola."
      - "Acompaña con el lácteo al lado."
    slots: [desayuno]
    components:
      - {role: protein, sel: "@lacteo_magro"}
      - {role: carb, sel: "@carbo_desayuno"}
      - {role: fat, sel: "@crema_frutos_secos"}

  - id: batido_avena_fruta
    name: Batido de proteína con avena y fruta
    recipe:
      - "Pon en la licuadora la fruta, la avena, la proteína en polvo y agua fría."
      - "Licúa un minuto hasta que no queden grumos."
      - "Sirve al momento: la avena espesa el batido si lo dejas reposar."
    slots: [desayuno]
    components:
      - {role: protein, sel: "@batido"}
      - {role: carb, sel: "@avena"}
      - {role: fruit, sel: "@fruta_bowl"}

  - id: loncha_carbo_aguacate
    name: Tostada con loncha y aguacate
    recipe:
      - "Tuesta el carbohidrato."
      - "Machaca el aguacate con un poco de sal y limón, y úntalo encima."
      - "Coloca las lonchas por encima y cierra o come abierto."
    slots: [desayuno]
    components:
      - {role: protein, sel: "@loncha"}
      - {role: carb, sel: "@carbo_desayuno"}
      - {role: fat, sel: "#aguacate"}

  # ------------------------------------------------------------------ SNACKS --
  # Un snack NO es una comida pequeña: es saciedad entre comidas. Una fruta, una
  # manzana con crema de almendras, un yogur griego con fruta. Nada de huevo duro
  # —que es lo que salía cuando el snack tenía que aportar su 10% de proteína—.
  # Máximo DOS componentes, y la proteína que no llevan la ponen las tres comidas
  # grandes (`macro_split.macro_shares`).

  - id: fruta_sola
    name: Fruta
    recipe:
      - "Lava la fruta y córtala como prefieras. Come."
    slots: [snack_am, snack_pm]
    components:
      - {role: fruit, sel: "@fruta"}

  - id: fruta_crema
    name: Fruta con crema de frutos secos
    recipe:
      - "Corta la fruta en tajadas."
      - "Sirve la crema de frutos secos al lado y ve mojando cada tajada."
    slots: [snack_am, snack_pm]
    components:
      - {role: fruit, sel: "@fruta"}
      - {role: fat, sel: "@crema_frutos_secos"}

  - id: fruta_frutos_secos
    name: Fruta con frutos secos
    recipe:
      - "Corta la fruta en trozos."
      - "Mézclala con los frutos secos en un tazón pequeño."
    slots: [snack_am, snack_pm]
    components:
      - {role: fruit, sel: "@fruta"}
      - {role: fat, sel: "@frutos_secos"}

  - id: lacteo_fruta
    name: Yogur griego con fruta
    recipe:
      - "Sirve el yogur en un tazón."
      - "Lava y corta la fruta encima. Si la mezclas, queda más dulce."
    slots: [snack_am, snack_pm]
    components:
      - {role: protein, sel: "@lacteo_magro"}
      - {role: fruit, sel: "@fruta"}

  # La salida cuando el cliente no tiene fruta en su lista: el yogur solo.
  - id: lacteo_solo
    name: Yogur griego
    recipe:
      - "Sirve el yogur en un tazón. Un toque de canela le cambia la vida."
    slots: [snack_am, snack_pm]
    components:
      - {role: protein, sel: "@lacteo_magro"}

  - id: loncha_carbo_snack
    name: Loncha con galletas o tostada
    recipe:
      - "Coloca las lonchas sobre las galletas o la tostada."
      - "Come al momento para que el carbohidrato no se ablande."
    slots: [snack_am, snack_pm]
    components:
      - {role: protein, sel: "@loncha"}
      - {role: carb, sel: "@carbo_snack"}

  - id: batido_fruta
    name: Batido de proteína con fruta
    recipe:
      - "Licúa la fruta con la proteína en polvo y agua bien fría."
      - "Sirve enseguida."
    slots: [snack_am, snack_pm]
    components:
      - {role: protein, sel: "@batido"}
      - {role: fruit, sel: "@fruta"}

  # --------------------------------------------------------- ALMUERZO / CENA --

  - id: proteina_carbo_ensalada
    name: Proteína con carbohidrato y ensalada
    recipe:
      - "Salpimenta la proteína y cocínala en una sartén caliente con poco aceite, girándola una sola vez para que no se seque."
      - "Cocina o calienta el carbohidrato aparte."
      - "Arma una ensalada generosa con lo que tengas: hojas, tomate, cebolla, pepino."
      - "Sirve todo junto y alíñala con limón, sal y un hilo de aceite."
    slots: [almuerzo, cena]
    free_salad: true
    components:
      - {role: protein, sel: "@carne_magra"}
      - {role: carb, sel: "@carbo_principal"}
      - {role: fat, sel: "@grasa_cocina", optional: true}

  - id: proteina_carbo_aguacate
    name: Proteína con carbohidrato y aguacate
    recipe:
      - "Cocina la proteína a fuego medio hasta que esté dorada por fuera y jugosa por dentro."
      - "Calienta el carbohidrato."
      - "Corta el aguacate en láminas y colócalo al lado, con sal y limón."
    slots: [almuerzo, cena]
    free_salad: true
    components:
      - {role: protein, sel: "@carne_magra"}
      - {role: carb, sel: "@carbo_principal"}
      - {role: fat, sel: "#aguacate"}
