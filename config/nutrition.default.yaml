version: "2026.08.14"                  # se guarda en cada plan (procedencia)
activity_factors:
  sedentary: 1.20
  light: 1.375
  moderate: 1.55
  active: 1.725
  very_active: 1.90
goal_adjustments:                      # fracción sobre TDEE
  lose_fat: -0.21
  maintain: 0.0
  gain_muscle: 0.10
# Proteína y grasa se fijan al SUELO de su rango: es lo que deja más kcal libres
# para el carbohidrato (que cierra el resto). El entrenador sube el slider por
# cliente cuando hace falta.
protein_g_per_kg:                      # rango admitido 1.6–2.2
  lose_fat: 1.6
  maintain: 1.6
  # Volumen: más proteína deja menos espacio al carbohidrato. Con 1.6 g/kg un
  # hombre de 60 kg a 5 comidas (o 3) pedía 170 g de carbo en el almuerzo y
  # ningún plato del catálogo lo alcanzaba sin pasarse de proteína.
  gain_muscle: 2.0
fat_g_per_kg:                          # rango admitido 0.8–1.0
  lose_fat: 0.8
  maintain: 0.8
  gain_muscle: 1.0
# Solo fallback si un objetivo no declara fat_g_per_kg. Un % fijo de las kcal se
# encoge con el déficit (0.62 g/kg en un plan de 1400 kcal) y se dispara en
# volumen (1.33 g/kg en uno de 3400): por eso g/kg manda.
fat_pct_of_kcal: 0.28

# Piso energético. Las kcal son el MÁXIMO de tres cosas: el déficit sobre el
# TDEE, el BMR (nadie come bajo su metabolismo basal) y este piso por sexo.
# Sin él, una mujer sedentaria de 70 kg salía en 1398 kcal y una de 80 kg en
# 1496 — por debajo de su propio BMR. Rango de la guía AHA/ACC/TOS: 1200–1500
# en mujeres, 1500–1800 en hombres.
kcal_floor:
  female: 1450
  male: 1700
carb_floor_g_per_kg: 0.5               # guarda de imposibilidad, no de opinión
fiber:
  g_per_1000_kcal: 14                  # estándar DRI
# Cuánto del día vale cada comida, MACRO A MACRO (cada columna suma 1.0).
#
# Un solo porcentaje por comida no describe ninguna comida real: el desayuno lleva
# mucho carbohidrato y poca proteína; la cena, al revés. Y un snack NO es una
# comida en pequeño — es saciedad: una fruta, un yogur, una manzana con crema de
# almendras. Con el 10% de proteína que tenían antes, el motor tenía que meterles
# una fuente proteica seria y acababa poniendo huevo duro a media mañana.
#
# Lo que el snack no lleva no se pierde: `macro_split.macro_shares` reparte cada
# macro solo entre las comidas que tienen fuente, así que la proteína de un snack
# de solo fruta la absorben desayuno, almuerzo y cena.
#
# La grasa no está: cierra a nivel de día y se reparte entre los ítems de grasa
# (ver portioning.py).
meal_distribution:
  desayuno: {kcal: 0.27,  protein_g: 0.22, carb_g: 0.30}
  snack_am: {kcal: 0.075, protein_g: 0.05, carb_g: 0.10}
  almuerzo: {kcal: 0.32,  protein_g: 0.36, carb_g: 0.30}
  snack_pm: {kcal: 0.075, protein_g: 0.05, carb_g: 0.10}
  cena:     {kcal: 0.26,  protein_g: 0.32, carb_g: 0.20}
tolerances:                            # desviación aceptada al validar
  kcal: 0.08
  protein_g: 0.10
  # Volumen con pocas comidas pide 150 g de carbo en un almuerzo; el catálogo
  # real aterriza ~120. 0.12 era imposible; 0.22 admite ese techo físico.
  carb_g: 0.22
  fat_g: 0.12
portioning:
  grams_rounding: 5                    # redondear porciones a múltiplos de 5 g
  min_portion_g: 20
generation:
  max_retries: 5                       # reintentos de selección por slot/día
  # Topes de variedad, POR SLOT (check_variety los suma sobre los slots donde el
  # alimento sale). El huevo estaba en 3 y los planes reales de la entrenadora
  # llevan huevo al desayuno 5 o 6 días de 7: era un tope que ningún plan de
  # verdad cumple. 4 es conservador y coincide con lo que el motor heurístico ya
  # hacía a mano (`egg_days = 4`).
  max_protein_repeats_per_week: 7      # sin tope práctico: 7 días = puede repetir
  max_carb_repeats_per_week: 7         # priorizar cuadrar macros sobre rotación forzada
# Check-in semanal: el código mueve kcal; la IA solo explica el resultado.
adaptation:
  step_kcal: 150
  max_raise_kcal: 400
  tolerance_kg: 0.2
  lose_fat_too_fast_kg: -1.0
  gain_muscle_too_fast_kg: 0.75
