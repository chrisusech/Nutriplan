# fly.toml — NutriPlan en Fly.io
#   fly launch --no-deploy   (primera vez, si hace falta)
#   fly secrets set ENV=prod DATABASE_URL=… SESSION_SECRET=… …
#   fly deploy

app = 'nutriplan'
primary_region = 'mia'

[build]

[deploy]
  # Migraciones contra la conexión DIRECTA de Supabase (:5432), no el pooler.
  # Pasa DIRECT_DATABASE_URL como secret aparte si DATABASE_URL es el pooler.
  release_command = 'sh -c "DATABASE_URL=${DIRECT_DATABASE_URL:-$DATABASE_URL} uv run alembic upgrade head"'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '45s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
