<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar contraseña · NutriPlan</title>
  <link rel="preload" href="/static/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/poppins-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
</head>
<body>
  <div class="auth-page">
    <div class="card auth-card">
      <div class="auth-brand">
        <span class="logo-badge"><span class="icon">restaurant</span></span>
        <span>NutriPlan</span>
      </div>
      <h1>Recuperar contraseña</h1>
      <p class="muted">
        En local no enviamos correo: te mostramos el enlace aquí mismo.
      </p>

      {% if error %}
      <div class="alert" role="alert">
        <span class="icon">error</span>{{ error }}
      </div>
      {% endif %}

      {% if sent %}
      <div class="alert alert-ok" role="status">
        <span class="icon">mail</span>
        Si ese correo tiene una cuenta, le acabamos de enviar un enlace.
      </div>
      {% endif %}

      <form method="post" action="/recuperar">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
        <label class="field"><span>Correo de tu cuenta</span>
          <input name="email" type="email" required placeholder="tu@correo.com"
                 value="{{ email or '' }}"></label>
        <button class="btn btn-primary btn-big" type="submit">
          Generar enlace
        </button>
      </form>

      <p class="muted">
        <a href="/login">Volver a entrar</a>
      </p>
    </div>
  </div>
</body>
</html>
