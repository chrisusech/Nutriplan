<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="{{ brand }}">
  <title>{% block title %}Mi semana{% endblock %} · NutriPlan</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="preload" href="/static/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/poppins-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
  {# El color de marca es lo único dinámico del estilo. Va en un atributo y no
     en un <style>, para que la CSP pueda prohibir el CSS inline entero. #}
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js?v={{ asset_v }}" defer></script>
</head>
<body class="{% block page_class %}{% endblock %}"
      data-brand="{{ brand }}" data-brand-soft="{{ brand_soft }}"
      hx-headers='{"X-Requested-With":"htmx"}'>

  <div class="app">
    <header class="app-head">
      <a class="logo" href="/">
        <span class="logo-badge"><span class="icon">restaurant</span></span>
        <span>Nutri<span class="brand-word">Plan</span></span>
      </a>
      {% block head_action %}{% endblock %}
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>
  </div>

  {% if trainer %}
  <nav class="nav" aria-label="Navegación principal">
    <a href="/" class="{% if active_tab == 'semana' %}on{% endif %}"
       {% if active_tab == 'semana' %}aria-current="page"{% endif %}>
      <span class="icon {% if active_tab == 'semana' %}fill{% endif %}">restaurant_menu</span>
      Mi semana
    </a>
    <a href="/feedback" class="{% if active_tab == 'feedback' %}on{% endif %}"
       {% if active_tab == 'feedback' %}aria-current="page"{% endif %}>
      <span class="icon {% if active_tab == 'feedback' %}fill{% endif %}">forum</span>
      Opinar
    </a>
    <a href="/perfil" class="{% if active_tab == 'perfil' %}on{% endif %}"
       {% if active_tab == 'perfil' %}aria-current="page"{% endif %}>
      <span class="icon {% if active_tab == 'perfil' %}fill{% endif %}">person</span>
      Perfil
    </a>
    {% if role == 'super_user' %}
    <a href="/admin/metricas" class="{% if active_tab == 'metricas' %}on{% endif %}">
      <span class="icon">insights</span>
      Métricas
    </a>
    {% endif %}
  </nav>
  {% endif %}
</body>
</html>
