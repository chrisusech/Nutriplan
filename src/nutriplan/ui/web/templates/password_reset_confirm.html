<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva contraseña · NutriPlan</title>
  <link rel="preload" href="/static/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/poppins-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
</head>
<body>
  <div class="auth-page">
    <div class="card auth-card">
      <div class="auth-brand">
        <span class="logo-badge"><span class="icon">restaurant</span></span>
        <span>NutriPlan</span>
      </div>
      <h1>Nueva contraseña</h1>
      <p class="muted">
        Cuenta: <b>{{ email }}</b>
      </p>

      {% if error %}
      <div class="alert" role="alert">
        <span class="icon">error</span>{{ error }}
      </div>
      {% endif %}

      <form method="post" action="/recuperar/{{ token }}">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
        <label class="field"><span>Contraseña nueva</span>
          <input name="password" type="password" required minlength="8" placeholder="mínimo 8 caracteres"></label>
        <label class="field"><span>Repite la contraseña</span>
          <input name="password_confirm" type="password" required minlength="8" placeholder="mínimo 8 caracteres"></label>
        <button class="btn btn-primary btn-big" type="submit">
          Guardar y entrar
        </button>
      </form>
    </div>
  </div>
</body>
</html>
