{% extends "shell_public.html" %}
{% block title %}Nueva contraseña{% endblock %}
{% block page_class %}page-form{% endblock %}

{% block body %}
<div class="form-page">
  <header class="form-head">
    <a class="back" href="/login" aria-label="Volver"><span class="icon">arrow_back</span></a>
  </header>

  <div class="form-intro">
    <span class="logo-badge"><span class="icon">lock_clock</span></span>
    <h1>Nueva contraseña</h1>
    <p class="muted">Cuenta: <b>{{ email }}</b></p>
  </div>

  {% if error %}
  <div class="alert" role="alert"><span class="icon">error</span>{{ error }}</div>
  {% endif %}

  <form method="post" action="/recuperar/{{ token }}" class="form-stack">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label class="field"><span>Contraseña nueva</span>
      <input name="password" type="password" required minlength="8"
             placeholder="mínimo 8 caracteres"></label>
    <label class="field"><span>Repite la contraseña</span>
      <input name="password_confirm" type="password" required minlength="8"
             placeholder="mínimo 8 caracteres"></label>
    <button class="btn btn-primary btn-big btn-block" type="submit">Guardar y entrar</button>
  </form>
</div>
{% endblock %}
