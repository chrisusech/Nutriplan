<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva contraseña · NutriPlan</title>
  <link rel="preload" href="/static/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/poppins-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
</head>
<body style="background:var(--bg)">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
    <div class="card" style="width:100%;max-width:400px;padding:34px 30px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <div class="logo-badge"><span class="icon" style="font-size:22px">restaurant</span></div>
        <span style="font:800 20px Poppins;color:var(--ink)">NutriPlan</span>
      </div>
      <h1 style="font:800 22px Poppins;color:var(--ink);margin:14px 0 4px">Nueva contraseña</h1>
      <p style="font:500 13px Poppins;color:var(--muted);margin:0 0 20px">
        Cuenta: <b>{{ email }}</b>
      </p>

      {% if error %}
      <div class="badge badge-warn" style="width:100%;justify-content:flex-start;margin-bottom:14px;padding:10px 12px">
        <span class="icon" style="font-size:16px">error</span>{{ error }}
      </div>
      {% endif %}

      <form method="post" action="/recuperar/{{ token }}" style="display:flex;flex-direction:column;gap:12px">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
        <label class="auth-field"><span>Contraseña nueva</span>
          <input name="password" type="password" required minlength="8" placeholder="mínimo 8 caracteres"></label>
        <label class="auth-field"><span>Repite la contraseña</span>
          <input name="password_confirm" type="password" required minlength="8" placeholder="mínimo 8 caracteres"></label>
        <button class="btn btn-primary btn-big" type="submit" style="margin-top:6px;justify-content:center">
          Guardar y entrar
        </button>
      </form>
    </div>
  </div>
</body>
</html>
